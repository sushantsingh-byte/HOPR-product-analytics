<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — HOPR</title><link rel="stylesheet" href="assets/css/style.css"><script src="assets/js/analytics.js"></script>
</head><body><div id="app-header"></div>
<main class="page narrow">
<section class="page-title"><span class="eyebrow">JOIN HOPR</span><h1>Create your account.</h1><p>Use this mock signup flow to practise activation and conversion analytics.</p></section>
<form id="signup-form" class="form-card">
<div class="field"><label>Full name</label><input id="signup-name" placeholder="Your name" required></div>
<div class="field"><label>Email</label><input id="signup-email" type="email" placeholder="you@example.com" required></div>
<div class="field"><label>Home city</label><select id="signup-city"><option>Noida</option><option>Delhi</option><option>Gurugram</option><option>Ghaziabad</option></select></div>
<div class="field"><label>Password</label><input id="signup-password" type="password" minlength="6" placeholder="Minimum 6 characters" required></div>
<label class="check"><input id="terms" type="checkbox" required> I agree to the community terms.</label>
<button class="btn btn-primary btn-wide" type="submit">Create account</button>
<div id="signup-success" class="success hidden"></div>
</form></main><div id="app-footer"></div><script src="assets/js/app.js"></script><script src="assets/js/account.js"></script></body></html>
